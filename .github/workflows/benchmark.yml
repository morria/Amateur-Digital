name: Benchmark

on:
  pull_request:
    paths: ['AmateurDigital/AmateurDigitalCore/Sources/**']

jobs:
  benchmark:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run all benchmarks
        run: |
          cd AmateurDigital/AmateurDigitalCore
          swift run -c release RTTYBenchmark
          swift run -c release PSKBenchmark
          swift run -c release CWBenchmark

      - name: Check regressions and post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const baselines = JSON.parse(fs.readFileSync('benchmarks/baselines.json'));
            const margin = 1.5;

            const decoders = [
              { name: 'RTTY', file: '/tmp/rtty_benchmark_latest.json', key: 'rtty' },
              { name: 'PSK',  file: '/tmp/psk_benchmark_latest.json',  key: 'psk' },
              { name: 'CW',   file: '/tmp/cw_benchmark_latest.json',   key: 'cw' },
            ];

            let table = '## Benchmark Results\n\n| Decoder | Score | Baseline | Status |\n|---------|-------|----------|--------|\n';
            let failed = false;

            for (const d of decoders) {
              try {
                const data = JSON.parse(fs.readFileSync(d.file));
                const score = data.composite_score;
                const baseline = baselines[d.key] || 0;
                const status = score >= baseline - margin ? ':white_check_mark:' : ':x: REGRESSION';
                if (score < baseline - margin) failed = true;
                const delta = score - baseline;
                const deltaStr = delta >= 0 ? `+${delta.toFixed(1)}` : delta.toFixed(1);
                table += `| ${d.name} | **${score.toFixed(1)}** | ${baseline.toFixed(1)} | ${status} (${deltaStr}) |\n`;
              } catch (e) {
                table += `| ${d.name} | N/A | - | :warning: Not found |\n`;
              }
            }

            if (failed) {
              table += '\n:rotating_light: **Regression detected** — score dropped below baseline minus margin (1.5 points)';
            }

            table += '\n\n_Generated by CI benchmark gate_';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: table
            });

            if (failed) {
              core.setFailed('Benchmark regression detected');
            }
