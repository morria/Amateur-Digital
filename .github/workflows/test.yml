name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build AmateurDigitalCore
        run: cd AmateurDigital/AmateurDigitalCore && swift build

      - name: Run unit tests
        run: cd AmateurDigital/AmateurDigitalCore && swift test

      - name: Run RTTY benchmark
        run: cd AmateurDigital/AmateurDigitalCore && swift run -c release RTTYBenchmark

      - name: Run PSK benchmark
        run: cd AmateurDigital/AmateurDigitalCore && swift run -c release PSKBenchmark

      - name: Run CW benchmark
        run: cd AmateurDigital/AmateurDigitalCore && swift run -c release CWBenchmark

      - name: Check benchmark regressions
        run: |
          python3 -c "
          import json, sys

          baselines = json.load(open('benchmarks/baselines.json'))
          margin = 1.5  # Allow up to 1.5 point drop (noise margin)
          failed = False

          for decoder, (json_path, key) in {
              'rtty': ('/tmp/rtty_benchmark_latest.json', 'composite_score'),
              'psk': ('/tmp/psk_benchmark_latest.json', 'composite_score'),
              'cw': ('/tmp/cw_benchmark_latest.json', 'composite_score'),
          }.items():
              try:
                  score = json.load(open(json_path))[key]
              except (FileNotFoundError, KeyError):
                  print(f'WARNING: {decoder} results not found')
                  continue

              baseline = baselines.get(decoder, 0)
              status = 'PASS' if score >= baseline - margin else 'FAIL'
              print(f'{decoder.upper():5s}: {score:5.1f} (baseline {baseline:.1f}, min {baseline-margin:.1f}) [{status}]')
              if status == 'FAIL':
                  failed = True

          if failed:
              print('\nREGRESSION DETECTED — one or more decoders below baseline')
              sys.exit(1)
          else:
              print('\nAll decoders above baseline — no regression')
          "
